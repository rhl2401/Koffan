services:
  shopping-list:
    build: .
    expose:
      - "8080"
    environment:
      - APP_ENV=production
      - APP_PASSWORD=${APP_PASSWORD:-shopping123}
      - API_TOKEN=${API_TOKEN:-}
      - MULTI_USER=${MULTI_USER:-}
      - ADMIN_USER=${ADMIN_USER:-}
      - API_WORKSPACE_ID=${API_WORKSPACE_ID:-}
      - PORT=8080
      - DB_PATH=/data/shopping.db
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - WEBHOOK_EVENTS=${WEBHOOK_EVENTS:-}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URL=${OIDC_REDIRECT_URL:-}
      - OIDC_SCOPES=${OIDC_SCOPES:-}
      - OIDC_BUTTON_LABEL=${OIDC_BUTTON_LABEL:-}
      - OIDC_USERNAME_CLAIM=${OIDC_USERNAME_CLAIM:-}
      - OIDC_GROUPS_CLAIM=${OIDC_GROUPS_CLAIM:-}
      - OIDC_ADMIN_GROUP=${OIDC_ADMIN_GROUP:-}
      - OIDC_AUTO_CREATE_USERS=${OIDC_AUTO_CREATE_USERS:-}
      - OIDC_DEFAULT_WORKSPACE_ID=${OIDC_DEFAULT_WORKSPACE_ID:-}
      - OIDC_DISABLE_PASSWORD_LOGIN=${OIDC_DISABLE_PASSWORD_LOGIN:-}
    volumes:
      - shopping-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:$${PORT}/login || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  shopping-data:
