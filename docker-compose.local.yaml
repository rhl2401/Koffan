services:
  shopping-list:
    build: .
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - APP_PASSWORD=${APP_PASSWORD:-shopping123}
      - PORT=8080
      - DB_PATH=/data/shopping.db
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - WEBHOOK_EVENTS=${WEBHOOK_EVENTS:-}
      - DISABLE_PASSWORD_AUTH=${DISABLE_PASSWORD_AUTH:-}
      - OAUTH_REDIRECT_BASE_URL=${OAUTH_REDIRECT_BASE_URL:-}
      - OAUTH_GENERIC_ISSUER_URL=${OAUTH_GENERIC_ISSUER_URL:-}
      - OAUTH_GENERIC_CLIENT_ID=${OAUTH_GENERIC_CLIENT_ID:-}
      - OAUTH_GENERIC_CLIENT_SECRET=${OAUTH_GENERIC_CLIENT_SECRET:-}
      - OAUTH_GENERIC_SCOPES=${OAUTH_GENERIC_SCOPES:-}
      - OAUTH_GENERIC_BUTTON_LABEL=${OAUTH_GENERIC_BUTTON_LABEL:-}
      - OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID:-}
      - OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET:-}
      - OAUTH_APPLE_CLIENT_ID=${OAUTH_APPLE_CLIENT_ID:-}
      - OAUTH_APPLE_CLIENT_SECRET=${OAUTH_APPLE_CLIENT_SECRET:-}
      - OAUTH_FACEBOOK_APP_ID=${OAUTH_FACEBOOK_APP_ID:-}
      - OAUTH_FACEBOOK_APP_SECRET=${OAUTH_FACEBOOK_APP_SECRET:-}
    volumes:
      - shopping-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:$${PORT}/login || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  shopping-data:
